# Drop this stanza into ~/.codex/config.toml to register the ChemSpace MCP
# server with Codex. The command resolves cscopilot-mcp via PATH, so make
# sure the cs_copilot environment with the [mcp] extra is activated.

[mcp_servers.chemspace]
command = "cscopilot-mcp"
args = [
    "--session-id", "demo",
    "--workflow-slug", "chemical_space",
    "--log-level", "info",
]

[mcp_servers.chemspace.env]
SESSION_ID = "demo"
USE_S3 = "false"
