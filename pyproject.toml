[project]
name = "cs_copilot"
version = "0.4.0"
description = "LLM-powered agent system for GTM-based chemical space analysis"
authors = [
    {name = "Alexey Orlov",email = "data2scale@gmail.com"},
]
dependencies = [
    "seaborn>=0.13.2",
    "jupyterlab>=4.4.9",
    "ipywidgets>=8.1.7",
    "optuna>=4.5.0",
    "chemographykit>=0.1.0",
    "ugtm>=2.1.0.post2",
    "rdkit>=2025.9.1",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "torchaudio>=2.9.0",
    "ipykernel>=7.0.1",
    "dill>=0.4.0",
    "accelerate>=1.11.0",
    "pandarallel>=1.6.5",
    "openai>=2.6.0",
    "lancedb>=0.25.2",
    "tantivy>=0.25.0",
    "pypdf>=6.1.2",
    "reportlab>=4.4.9",
    "requests>=2.32.5",
    "exa-py>=1.16.1",
    "newspaper4k>=0.9.3.1",
    "lxml-html-clean>=0.4.3",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.44",
    "agno==2.1.9",
    "ollama>=0.4.0",
    "chembl-webresource-client>=0.10.9",
    "pubchempy>=1.0.5",
    "CairoSVG>=2.8.2",
    "vl-convert-python>=1.8.0",
    "tabulate>=0.9.0",
    "chainlit>=2.8.3",
    "s3fs>=2025.9.0",
    "asyncpg>=0.30.0",
    "numba>=0.62.1",
    "huggingface-hub<1.0",
    "deepchemography @ git+https://github.com/AxelRolov/deepchemography.git@301130e889a4697a876be2db8644cbba875ce0da",
    # chembed is the small-molecule autoencoder; deepchemography above is retained
    # because the peptide WAE (Case Study 4) still imports it.
    "chembed==1.0.1",
    "selfies>=2.1.2",
    "chembl-structure-pipeline>=1.2.2",
    "fastparquet>=2024.5.0",
    "lightning>=2.4",
    "setuptools>=70",
    "marimo>=0.18.4",
    "transformers>=4.57.3",
    "sentence-transformers>=5.2.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "boto3>=1.42.30",
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cs_copilot"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "cs_copilot/skills/catalog"
"workflow_catalog" = "cs_copilot/workflows/catalog"

[tool.hatch.build.targets.sdist]
only-include = [
    ".agents",
    ".chainlitignore",
    ".dockerignore",
    ".env.example",
    ".github",
    ".modelconf",
    ".pre-commit-config.yaml",
    "CITATION.cff",
    "Dockerfile",
    "Dockerfile.minio",
    "LICENSE",
    "README.md",
    "chainlit.md",
    "chainlit.toml",
    "chainlit_app.py",
    "docker-compose.cpu.yml",
    "docker-compose.dev.yml",
    "docker-compose.gpu.yml",
    "docker-compose.yml",
    "docker-entrypoint.sh",
    "docker-start.sh",
    "docs",
    "examples",
    "mkdocs.yml",
    "models",
    "package.json",
    "plugins",
    "prisma",
    "public",
    "pyproject.toml",
    "scripts",
    "skills",
    "src",
    "tests",
    "uv.lock",
    "workflow_catalog",
]
skip-excluded-dirs = true
exclude = [
    "/.claude",
    "/.codex",
    "/.env",
    "/.env.*",
    "/.venv",
    "/.vscode",
    "/*.db",
    "/**/*.db",
    "/*.sqlite",
    "/**/*.sqlite",
    "/*.sqlite3",
    "/**/*.sqlite3",
    "/data",
    "/dist",
    "/site",
    "/synplan_data",
    "/synplan_preset",
    "/_panviro_gtm_ws",
    "/**/.cache",
    "/**/.cache/**",
    "/**/.env",
    "/**/.env.*",
    "/**/.pytest_cache",
    "/**/.pytest_cache/**",
    "/**/.vscode",
    "/**/.vscode/**",
    "/**/__pycache__",
    "/**/__pycache__/**",
    "/**/*.db-journal",
    "/**/*.db-shm",
    "/**/*.db-wal",
    "/**/*.pem",
    "/**/*.key",
    "/**/*.sqlite-journal",
    "/**/*.sqlite-shm",
    "/**/*.sqlite-wal",
    "/**/*.sqlite3-journal",
    "/**/*.sqlite3-shm",
    "/**/*.sqlite3-wal",
    "/**/*client-secret*.json",
    "/**/*credentials*.json",
    "/**/.staging",
    "/**/.staging/**",
    "/**/artifacts",
    "/**/artifacts/**",
    "/**/events",
    "/**/events/**",
    "/**/runs",
    "/**/runs/**",
    "/**/sessions",
    "/**/sessions/**",
]

[project.scripts]
cscopilot = "cs_copilot.cli:main"
cscopilot-mcp = "cs_copilot.mcp.__main__:main"
cscopilot-mcp-serve = "cs_copilot.mcp.__main__:serve_main"
cscopilot-mcp-check = "cs_copilot.mcp.check:main"

[project.optional-dependencies]
retrosynthesis = [
    "SynPlanner==1.7.0",
]
postgresql = [
    "psycopg2-binary>=2.9.9",
]
mcp = [
    "mcp>=1.2,<2",
]
# Aligned peptide sequence logos (analyze_peptide_candidates(align=True)): PyFAMSA
# aligns and Logomaker renders, as for the published node-level logos. Optional because
# PyFAMSA is GPL-3.0 and ships Linux wheels only for glibc >= 2.34.
peptide-logos = [
    "pyfamsa>=0.7.0",
    "logomaker>=0.8.7",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.8.0",
    "sentence-transformers>=3.0.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

# PyPI's Linux aarch64 torch wheels are CPU-only, so ARM GPU hosts (e.g. NVIDIA GB10)
# take torch from PyTorch's CUDA 13.0 index. Other platforms stay on PyPI. That index's
# torchaudio wheels declare no torch pin, so keep the trio on the versions PyPI resolves.
[tool.uv]
# chembed declares these and imports none of them (checked against the import
# block of every module in the package). Excluding them keeps TensorFlow, and
# its missing aarch64/CUDA-13 wheel story, out of the image entirely.
# Not torchmetrics: pytorch_lightning imports it at module level.
exclude-dependencies = ["tensorflow", "tensorboard", "bio", "duckdb", "polars", "h5py"]
constraint-dependencies = [
    "torch==2.10.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torchvision==0.25.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torchaudio==2.10.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_third_party = ["mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-third-party = ["mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m \"not live\""
markers = [
    "live: tests that spawn subprocesses or hit external services (skipped by default; opt in with `-m live`)",
]
