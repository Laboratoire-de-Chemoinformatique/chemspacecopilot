name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run black --check src/ tests/

      - name: Run linter
        run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short
        env:
          USE_S3: "false"

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install MCP dependencies
        run: uv sync --extra mcp

      - name: Build and audit release archives
        run: |
          uv build
          uv run python scripts/audit_release_artifacts.py

      - name: Smoke-test installed wheel metadata
        run: |
          python -m venv /tmp/cs-copilot-wheel-smoke
          /tmp/cs-copilot-wheel-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/cs-copilot-wheel-smoke/bin/python - <<'PY'
          import cs_copilot
          from importlib.metadata import distribution
          from pathlib import Path

          package_root = Path(next(iter(cs_copilot.__path__)))
          installed = distribution("cs_copilot")
          assert installed.version == "0.2.0"
          assert any(item.name == "cscopilot-mcp" for item in installed.entry_points)
          assert package_root.joinpath(
              "skills/catalog/chembl-to-gtm-report/SKILL.md"
          ).is_file()
          assert package_root.joinpath(
              "workflows/catalog/chembl-to-gtm-report/WORKFLOW.md"
          ).is_file()
          PY

      - name: Smoke-test plugin MCP command
        env:
          USE_S3: "false"
        run: uv run cscopilot-mcp-check --profile standard --json --timeout 30
