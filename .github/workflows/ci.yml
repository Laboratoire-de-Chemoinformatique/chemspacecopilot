name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run --no-sync black --check src/ tests/

      - name: Run linter
        run: uv run --no-sync ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --frozen --extra mcp

      - name: Run unit tests
        run: uv run --no-sync pytest tests/unit/ -v --tb=short
        env:
          USE_S3: "false"

  retrosynthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Install pinned retrosynthesis profile
        run: uv sync --frozen --extra retrosynthesis
      - name: Exercise real planning and native route figures
        env:
          USE_S3: "false"
          AGNO_TELEMETRY: "false"
          CUDA_VISIBLE_DEVICES: "-1"
        run: uv run --no-sync python scripts/smoke_synplanner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synplanner-integration-smoke
          path: |
            reports/synplanner-smoke.json
            data/sessions/synplanner-integration-smoke/

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install MCP dependencies
        run: uv sync --frozen --extra mcp

      - name: Build and audit release archives
        run: |
          uv build
          uv run --no-sync python scripts/audit_release_artifacts.py

      - name: Smoke-test installed wheel metadata
        run: |
          python -m venv /tmp/cs-copilot-wheel-smoke
          /tmp/cs-copilot-wheel-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/cs-copilot-wheel-smoke/bin/python - <<'PY'
          import cs_copilot
          from importlib.metadata import distribution
          from pathlib import Path

          package_root = Path(next(iter(cs_copilot.__path__)))
          installed = distribution("cs_copilot")
          assert installed.version == "0.2.0"
          assert any(item.name == "cscopilot-mcp" for item in installed.entry_points)
          assert package_root.joinpath(
              "skills/catalog/chembl-to-gtm-report/SKILL.md"
          ).is_file()
          assert package_root.joinpath(
              "workflows/catalog/chembl-to-gtm-report/WORKFLOW.md"
          ).is_file()
          PY

      - name: Smoke-test plugin MCP command
        env:
          USE_S3: "false"
        run: uv run --no-sync cscopilot-mcp-check --profile standard --json --timeout 30

      - name: MCP stdio integration
        env:
          USE_S3: "false"
        run: uv run --no-sync pytest tests/integration/mcp/ -m live
